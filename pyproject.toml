[project]
name = "uqab"
version = "1.0.0"
description = "UQAB - persona-shaped Tor pluggable transport and browser"
requires-python = ">=3.11"

# The engine itself is standard-library only. These are for development and for
# reproducing the verification gates (`pip install -e ".[dev]"`).
[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["app", "node_modules", "dist", "build", "run", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = "(^app/|^dist/|^node_modules/|^build/|^run/|^data/)"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = [
    "analysis*", "app_api*", "config*", "cover*", "dashboard*", "experiments*",
    "lab*", "packaging*", "persona*", "profile*", "protocol*", "pt*",
    "security*", "storage*", "tunnel*",
]

[tool.coverage.run]
source = [
    "pt", "protocol", "cover", "persona", "tunnel", "security", "app_api",
    "profile", "analysis", "experiments", "storage", "dashboard",
]

[tool.coverage.paths]
source = ["analysis", "app_api", "config", "cover", "dashboard", "experiments", "lab", "persona", "profile", "protocol", "pt", "security", "storage", "tunnel"]
